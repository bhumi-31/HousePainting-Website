services:
  - type: web
    name: housepainting-api-bhumi31
    runtime: node
    plan: free
    rootDir: paint-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        value: https://housepainting-web-bhumi31.onrender.com

  - type: web
    name: housepainting-web-bhumi31
    runtime: static
    rootDir: paint-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        fromService:
          name: housepainting-api-bhumi31
          type: web
          envVarKey: RENDER_EXTERNAL_URL
