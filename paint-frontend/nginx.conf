# Nginx configuration for React SPA (Single Page Application)
# This handles routing for React Router

server {
    listen 80;
    server_name localhost;
    
    # Where the files are located
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Handle React Router - redirect all requests to index.html
    # This is important! Without this, direct URLs like /services won't work
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    # When frontend calls /api/*, it forwards to backend container
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
